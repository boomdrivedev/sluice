$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it (core.21).
  # moon walks the root project's globs on disk, not through git, so its
  # inputs leave out by hand each path .gitignore names, and ruff's cache,
  # which ignores itself: a key that names a file the tree does not hold
  # is one no signer bears out, and the bolt's signer refuses it (C.6;
  # record 0125).
  format:
    command: 'treefmt --ci'
    inputs:
      - '/**/*'
      - '!/target/**'
      - '!/result/**'
      - '!/**/.devenv/**'
      - '!/**/.devenv.flake.nix'
      - '!/**/devenv.local.nix'
      - '!/**/.pre-commit-config.yaml'
      - '!/**/.moon/cache/**'
      - '!/.ruff_cache/**'
      - '!/site/node_modules/**'
      - '!/site/dist/**'
      - '!/site/.astro/**'
      - '!/site/src/content/docs/decisions/**'
      - '!/site/src/generated/**'
      - '!/site/public/screenshots/**'
      - '!/.mcp.json'
      - '!/.claude/settings.json'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy --workspace --all-targets -- -D warnings'
    inputs: ['/crates/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy and rustfmt are the build .prototools pins, on
  # whichever host runs the gate (core.24). It reads the tools it checks
  # from outside the tree, so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # The Claude Code marketplace, which spans the plugins: it validates, and
  # every plugin it lists has a manifest. Each plugin's own checks are its
  # project's (plugins/*/moon.yml).
  marketplace:
    command: 'plugins/check-marketplace.sh'
    inputs: ['/.claude-plugin/**/*', '/plugins/*/.claude-plugin/plugin.json', '/plugins/check-marketplace.sh', '/plugins/claude.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every file that carries sluice's version gives the workspace's, 0.0.0
  # on main; the marketplace names none; every plugin manifest is among the
  # files set-version.sh writes; and the writer, run on a scratch copy,
  # writes a release's version into each and changes nothing else
  # (check-versions.sh; record 0111; core.55). jq is devenv's.
  versions:
    command: 'sh check-versions.sh'
    inputs: ['/Cargo.toml', '/Cargo.lock', '/.claude-plugin/marketplace.json', '/plugins/*/.claude-plugin/plugin.json', '/plugins/*/herdr-plugin.toml', '/set-version.sh', '/check-versions.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The workflow releases as record 0111 has it: the binaries built from
  # the release's tree with nothing given, the release commit and its tag
  # pushed alone, and the next version reckoned from the newest tag
  # (check-release.sh; core.55). actionlint, under format, reads the
  # workflow's keys and shell; this reads what a release's steps must be.
  release:
    command: 'sh check-release.sh'
    inputs: ['/.github/workflows/ci.yml', '/check-release.sh']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every spec under openspec/specs passes openspec validate --strict, which
  # fails a warning as an error, by the openspec devenv.nix pins (core.24).
  # It sends no usage statistics and asks for no newer release.
  specs:
    command: 'openspec validate --specs --strict --no-interactive'
    env: {OPENSPEC_TELEMETRY: '0', OPENSPEC_NO_UPDATE_CHECK: '1'}
    inputs: ['/openspec/specs/**/*', '/openspec/config.yaml', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # Every open change under openspec/changes passes the same strict
  # validation, and archives cleanly: openspec archive applies its deltas,
  # alone, to a scratch copy of the specs, and each spec it writes passes
  # openspec validate --strict (check-changes.sh; record 0128, core.61). So
  # a change archive would refuse, or archive into a spec root:specs fails,
  # fails the unit's own checks and not first at its merge. The specs are
  # read and rebuilt, so they are inputs too; the archived changes are not.
  changes:
    command: 'sh check-changes.sh'
    inputs: ['/openspec/changes/**/*', '!/openspec/changes/archive/**/*', '/openspec/specs/**/*', '/openspec/config.yaml', '/check-changes.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # check-changes.sh does what core.61 asks of each open change: its cases,
  # each a scratch tree of its own holding the changes a scenario of
  # repository-gate's requirement names, a requirement past OpenSpec's 500
  # characters among them, check its exit and its words
  # (check-changes-cases.sh; record 0128 as amended 2026-11-16, core.61).
  # It reads no file of the tree but the two scripts.
  changes-cases:
    command: 'sh check-changes-cases.sh'
    inputs: ['/check-changes.sh', '/check-changes-cases.sh', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # The scene the plugins' screenshots are taken of, built --fast with the
  # sluice built here and asserted, so a change to sluice that breaks it
  # fails here and not at the next retake. It reads the tools it drives from
  # outside the tree, so it never replays. It runs only on a Mac, where the
  # screenshots are taken, so the gate runs it and Linux CI does not. It is
  # not kept out of CI: the gate runs moon in CI mode, which would skip it.
  screenshots-scene:
    command: 'bash plugins/screenshots-scene.sh --check'
    # The scene and the sluice it builds from this tree.
    inputs: ['/plugins/screenshots-scene.sh', '/crates/sluice/**/*', '/crates/sluice-seams/**/*', '/crates/sluice-core/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock']
    tags: [check-e2e]
    options: {runFromWorkspaceRoot: true, cache: false, os: macos}
  # The screenshots themselves (plugins/screenshots-capture.sh), run by hand
  # in devenv shell: the gate cannot, since it drives a GUI terminal and a
  # logged-in Claude Code. No tag puts it in a tier.
  screenshots:
    command: 'bash plugins/screenshots-capture.sh'
    options: {runFromWorkspaceRoot: true, cache: false, runInCI: false}
