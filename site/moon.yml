$schema: 'https://moonrepo.dev/schemas/project.json'

# The documentation site. It holds no check: its pages are Markdown, which
# no task reads (principle 16; core.21; record 0127), and it has no tests.
# Its build, which makes the decision and rules pages from docs/adr and
# docs/architecture/core.md, is the Pages workflow's and is not part of
# any gate.
language: 'typescript'
layer: 'application'

tasks:
  build:
    command: 'bun run build'
    inputs: ['**/*', '/docs/adr/*.md', '/docs/architecture/core.md', '/docs/diagrams/sluice.py', '/plugins/*/screenshots/*.png']
    outputs: ['dist']
    options: {cache: false}
