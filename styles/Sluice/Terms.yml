# The words a user sees, where the statement's design words would leak in.
extends: substitution
message: "Use '%s' instead of '%s': the pages use the words a user sees."
description: "The pages use the words a user sees in sluice's own output. The statement's design words are for the statement and the rules page, which maps them."
level: warning
ignorecase: false
swap:
  'the line': 'the branch'
  'a line': 'a branch'
  'an entry': 'a submission'
  'the entry': 'the submission'
  'entries': 'submissions'
  'a place': 'a checkout'
  'the place': 'the checkout'
  'places': 'checkouts'
  'a candidate': 'a combination'
  'the candidate': 'the combination'
  'candidates': 'combinations'
  'the culprit': 'the blamed submission'
  'a verdict': 'a result'
  'the verdict': 'the result'
  'verdicts': 'results'
  'the window': 'parallel'
  'deepest[- ]first': 'batch'
  'the records': 'the state'
  'work tree': 'worktree'
  'work-tree': 'worktree'
  'merge queue bot': 'merge queue'
  # The host that moves a branch's queue, and the role it starts builds
  # with, in the reader's words (record 0058 as amended 2026-11-18).
  'the lead role': 'the start role'
  'lead role': 'start role'
  'the lead': 'the host that runs the queue'
  'a lead': 'a host that runs the queue'
  '(?:leads|leading|led)': 'runs the queue'
