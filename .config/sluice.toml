# sluice's gate for its own branches (docs/plans/phase-1-integrations.md,
# section 9). Read from each branch's own revision (core.15).

[tests]
runner = "moon"
# Printed outside the executor and sourced inside it (section 4).
toolchain = ["devenv", "print-dev-env"]

[executor]
kind = "sandbox"
# The integration tests listen on localhost; nothing reaches further.
network = "localhost"
# The stack and e2e tests start their containers and wait for them within
# their own limit (66; ADR 0016).
docker = true

# The one signer whose runs the gates count (78, 79): deneb, where the
# sessions run and submit, signing as sessions with its own key. Its runs
# are sandboxed, never confined. Naming a signer keeps every branch with a
# remote on it, its state there beside the branch (C.6), so the host that
# keeps main on origin takes main's pull requests in (137; record 0125).
[signers.sessions]
ssh = "deneb ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHGx/Ip3yodP/Rg3DdMAjJXoYuBmMxTLpPrka3ei69M/ sluice deneb"

[branches."bolt/*"]
required = ["#check-fast"]
# A replay counts when a run deneb signed recorded a pass for its key (108).
trust = ["sessions"]
# Bolts live on GitHub, as main does: crew pushes each new one there, and
# sluice lands on it by a leased push, so agents on any host share it.
remote = "origin"

# main counts the runs deneb signs, sandboxed until runs are confined. A
# replay counts only when such a run recorded a pass for its key (108).
[branches.main]
required = ["#check-fast", "#check-tools", "#check-e2e"]
batch = true
trust = ["sessions"]
# main lives on GitHub: fetched every round, landed by a leased push.
remote = "origin"

# main takes its work as pull requests on GitHub (C.7): a submit pushes the
# agent's branch and opens its pull request, which the host that keeps main
# on origin takes in once it meets these, and tests and lands as any other.
# sluice's gate is the one above, so a pull request waits on nothing more.
[branches.main.pull_requests]
reviews = 0
