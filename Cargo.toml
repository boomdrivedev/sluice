[workspace]
resolver = "2"
members = [
  "crates/sluice-seams",
  "crates/sluice-core",
  "crates/sluice-fakes",
  "crates/sluice-conformance",
  "crates/sluice",
]

[workspace.package]
# main gives 0.0.0. A release's tag names a release commit that writes the
# release's version here and into every file that carries sluice's
# (set-version.sh), and root:versions holds them equal (record 0111).
version = "0.112.14"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gix = { version = "0.89", default-features = false, features = [
  "max-performance-safe",
  "sha1",
  "basic",
  "revision",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Signed run records (ADR 0032): DSSE digests and moon's keys.
sha2 = "0.10"
base64 = "0.22"
ssh-key = { version = "0.6", features = ["ed25519", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4", features = ["derive", "env"] }
# A command starts sluice's host process in a session of its own, and
# sluice host starts each worker in a process group of its own that ends
# when it drops the worker, through process-wrap
# (`each-worker-starts-through-process-wrap@025fae162990`).
process-wrap = { version = "11", default-features = false, features = [
  "std",
  "tokio1",
  "process-session",
  "process-group",
  "kill-on-drop",
] }
# A command's standard input, written whole before it starts, in a
# process with no runtime: no thread writes it beside the read.
tempfile = "3"
nix = { version = "0.31", default-features = false, features = [
  "signal",
  "process",
  "hostname",
  "user",
  "fs",
  "event",
] }
# Telemetry (ADRs 0014, 0022): the core emits tracing spans and events;
# the binary exports them over OTLP/HTTP when asked to.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = [
  "metrics",
] }
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "http-proto",
  "reqwest-blocking-client",
] }
# What a failure's output is scrubbed of before it is sent (ADR 0022).
regex = "1"

# sluice's identity on a forge: a JWT signed with the app's key (RS256).
jsonwebtoken = "9"
# The container engine's API over its socket or TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# GitHub's API, read and written by sluice host through octocrab over a
# tower stack of its own: one limit on the calls in flight for the
# process, a timeout, and a layer that reads GitHub's budget from its
# headers, on hyper's client over rustls on ring with the webpki roots,
# following no redirect
# (`sluice-host-reads-github-through-octocrab-with-tower-layers@57c2759bda97`).
octocrab = { version = "0.54", default-features = false, features = [
  "default-client",
  "rustls",
  "rustls-ring",
] }
tower = { version = "0.5", default-features = false, features = [
  "limit",
  "timeout",
  "util",
] }
hyper-util = { version = "0.1", default-features = false, features = [
  "client-legacy",
  "http1",
  "tokio",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "ring",
  "tls12",
  "webpki-roots",
] }
http-body-util = "0.1"

# Every call to a remote runs under one retry policy (ADR 0062): a
# maintained crate's backoff, blocking, with no async runtime.
backon = { version = "1.6", default-features = false, features = [
  "std",
  "std-blocking-sleep",
] }

# A submission's outcome is a weir delivery (record 0102): weir's form,
# its calls and its pack, at the revision a change names (D1). A call to
# a remote runs to the family's limit for a try, ended with everything it
# started, through weir's crate for it (record 0109 as amended 2026-11-11;
# agentplot/weir record 0008).
weir-delivery = { git = "https://github.com/agentplot/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-pack = { git = "https://github.com/agentplot/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }
weir-bounded = { git = "https://github.com/agentplot/weir", rev = "9cba69196e9269a36b02024861340355bdbe6d4b" }

# Keyless signatures (record 0119; design D13 of the change
# `a-runs-life-is-written-first-and-actions-runs-its-checks`): a GitHub
# Actions job's bundle verified against the trusted roots the crate carries,
# the public-good instance's and GitHub's, with no TUF fetching, so a host
# verifies from the records alone (78). Pinned exactly, two weeks old at the
# least.
sigstore-verify = { version = "=0.15.1", default-features = false, features = [
  "aws-lc-rs",
] }
sigstore-trust-root = { version = "=0.15.1", default-features = false, features = [
  "aws-lc-rs",
] }

# A key-service signer's records (record 0119; design D7 of the change
# `a-codebuild-fleet-runs-a-queues-checks`): ECDSA P-256 over a DSSE
# envelope's encoding, as timber's key-service signer signs (timber record
# 0017), verified from the public half the policy lists. Pinned exactly,
# two weeks old at the least.
p256 = { version = "=0.13.2", default-features = false, features = [
  "ecdsa",
  "pkcs8",
] }

# A CodeBuild pool (record 0119; design D9 of the change
# `a-codebuild-fleet-runs-a-queues-checks`): CodeBuild, S3, KMS and STS
# reached through the AWS SDK's own chain at each call, as timber's KMS
# signer reaches KMS (timber record 0017), at the versions timber pins and
# the services' of the same release, over rustls on ring, on a
# current-thread runtime the profile enters for each call alone.
aws-config = { version = "1.13", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
  "sso",
  "credentials-process",
] }
aws-sdk-codebuild = { version = "1.143", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-sdk-kms = { version = "1.126", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-sdk-s3 = { version = "1.155", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-sdk-sts = { version = "1.122", default-features = false, features = [
  "rt-tokio",
  "behavior-version-latest",
] }
aws-runtime = "1.10"
aws-types = "1.7"
aws-smithy-types = "1.9"
http = "1"
# The CodeBuild pool's template read back as YAML by its tests.
yaml-rust2 = "0.11"
aws-smithy-http-client = { version = "1.5", features = ["rustls-ring"] }
tokio = { version = "1", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "net",
  "time",
  "signal",
  "sync",
  "macros",
  "io-util",
  "process",
] }
# sluice host's edge (the change `sluice-host-runs-on-a-tokio-edge`): its
# tasks and stops, its socket's lines, and the file events that start a
# reading. The core stays synchronous.
tokio-util = { version = "0.7", features = ["rt", "codec"] }
# A subscription's streams, keyed by folder, and a `watch` channel as a
# stream (the change `sluice-host-answers-every-read`, design D6).
tokio-stream = { version = "0.1", features = ["sync"] }
# A subscription's lines sent to a `FramedWrite` (design D6).
futures-util = { version = "0.3", default-features = false, features = [
  "alloc",
  "sink",
] }
notify-debouncer-full = "=0.6.0"

# A CodeBuild run build's hand-over, a zip CodeBuild uploads, read and
# never written by sluice (design D6 of the change
# `a-codebuild-fleet-runs-a-queues-checks`). Pinned exactly, two weeks old
# at the least.
zip = { version = "=9.2.1", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

# Every sluice process raises its soft limit on open files to its hard
# limit as it starts, as far as the system lets one process open (macOS's
# kern.maxfilesperproc), through a maintained crate (135; record 0126).
rlimit = "0.11"

# A worker's record, written by the child between its fork and its exec,
# and a process's start time and parent, read from the system (the change
# `sluice-host-owns-its-workers`).
libc = "0.2"

# The tests' guard lists the processes of a test by their working folder
# and their environment (the change `sluice-host-owns-its-workers`,
# design D6).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# The tests' container engine over TLS: its certificates, made in each
# test's scratch directory, and its server, on the ring provider ureq uses.
rcgen = { version = "0.14", default-features = false, features = [
  "pem",
  "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
