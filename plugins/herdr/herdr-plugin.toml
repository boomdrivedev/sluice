id = "agentplot.sluice"
name = "sluice"
version = "0.112.1"
min_herdr_version = "0.9.3"
description = "sluice's merge queue beside your agents: a status popup, toasts when a submission lands or is blamed, a line on each agent's row, and the queue in the tab bar."
platforms = ["linux", "macos"]

# One watcher for all of the user's herdr servers on a host: each server's
# startup and events register that server with it and wake it, and, where
# none runs, the command becomes the watcher.
[[startup]]
command = ["sh", "bin/watch.sh", "--ensure"]

[[events]]
on = "pane.created"
command = ["sh", "bin/watch.sh", "--ensure"]

[[events]]
on = "worktree.created"
command = ["sh", "bin/watch.sh", "--ensure"]

# The watcher runs as the command herdr started it with, herdr's own child.
# When that herdr server ends, its watcher asks another server it serves to
# start the next one by this action.
[[actions]]
id = "watch"
title = "sluice: keep the queue current in this herdr server"
contexts = ["global"]
command = ["sh", "bin/watch.sh", "--ensure"]

[[actions]]
id = "status"
title = "sluice: the queue"
contexts = ["global", "pane"]
command = ["sh", "bin/open.sh", "status"]

[[actions]]
id = "dashboard"
title = "sluice: the queue in its own tab"
contexts = ["global"]
command = ["sh", "bin/open.sh", "dashboard"]

[[actions]]
id = "jump"
title = "sluice: jump to the blamed submission's pane"
contexts = ["global", "pane"]
command = ["sh", "bin/jump.sh"]

# A row's link, from Ctrl-click on it (the link handler below).
[[actions]]
id = "open-link"
title = "sluice: the pane or log a row names"
contexts = ["global", "pane"]
command = ["sh", "bin/link.sh"]

[[link_handlers]]
id = "rows"
title = "sluice: a submission's pane, a failed test's log"
pattern = "^sluice-herdr:(focus|log)\\?"
action = "open-link"

[[actions]]
id = "setup"
title = "sluice: keys, sidebar rows and tab bar to add to your config"
contexts = ["global"]
command = ["sh", "bin/open.sh", "setup"]

[[panes]]
id = "status"
title = "sluice"
placement = "popup"
width = "80%"
height = "70%"
command = ["sh", "bin/status.sh"]

[[panes]]
id = "dashboard"
title = "sluice"
placement = "tab"
command = ["sh", "bin/status.sh", "--dashboard"]

[[panes]]
id = "setup"
title = "sluice: setup"
placement = "popup"
width = "90%"
height = "90%"
command = ["sh", "bin/setup.sh"]

[[panes]]
id = "log"
title = "sluice: log"
placement = "split"
command = ["sh", "bin/log.sh"]
