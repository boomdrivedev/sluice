$schema: 'https://moonrepo.dev/schemas/project.json'

dependsOn: [seams, core]

tasks:
  test:
    command: 'cargo nextest run -p sluice-fakes'
    inputs: ['/crates/sluice-fakes/**/*', '/crates/sluice-seams/**/*', '/crates/sluice-core/**/*', '/Cargo.toml', '/Cargo.lock', '/.config/nextest.toml', '/devenv.nix', '/devenv.lock']
    tags: [cargo-test, check-fast]
    options: {runFromWorkspaceRoot: true}
