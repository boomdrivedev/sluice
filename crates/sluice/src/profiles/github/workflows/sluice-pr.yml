# Written by `sluice init actions`, sluice {{version}} (record 0119; 113):
# a pull request's head run on each system the pool's runners name, with no
# secret and no identity token of sluice's. After the checks the run job
# leaves room, between its two `# sluice:` lines, for your own steps, which
# run in the checkout the checks ran in, $SLUICE_CHECKOUT, before it is
# released. `sluice`'s sign job signs the keys its tree bears out, as on the
# signer's branch. `sluice init actions --force` writes it again, keeping
# your own steps.
name: sluice-pr
on: pull_request
permissions: {}
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include: [{system: linux-x64, runner: ubuntu-24.04}] # the pool's runners
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Install sluice
        run: |
          case "$(uname -sm)" in
            "Linux x86_64") system=x86_64-linux ;;
            "Linux aarch64") system=aarch64-linux ;;
            "Darwin arm64") system=aarch64-darwin ;;
            *) echo "no release of sluice runs on $(uname -sm)" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/agentplot/sluice/releases/download/v${SLUICE_VERSION}/sluice-${system}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          SLUICE_VERSION: "{{version}}"
      - name: Run the head's checks
        run: sluice job run --head "$HEAD" --branch "$BASE" --system "$SYSTEM" --out "$RUNNER_TEMP/sluice-run" --checkout "$RUNNER_TEMP/sluice-checkout"
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SYSTEM: ${{ matrix.system }}
      - name: Name the checkout the checks ran in
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/sluice-checkout" ]; then
            echo "SLUICE_CHECKOUT=$(head -n 1 "$RUNNER_TEMP/sluice-checkout")" >> "$GITHUB_ENV"
          fi
      # sluice: your own steps, after the checks, in $SLUICE_CHECKOUT
      # sluice: end of your own steps
      - name: Release the checkout
        if: always()
        run: sluice job release --checkout "$RUNNER_TEMP/sluice-checkout" --out "$RUNNER_TEMP/sluice-run"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sluice-run-${{ matrix.system }}
          path: ${{ runner.temp }}/sluice-run
          if-no-files-found: ignore
