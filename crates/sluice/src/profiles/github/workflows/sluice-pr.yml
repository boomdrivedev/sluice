# Written by `sluice init actions`, sluice {{version}} (record 0119; 113):
# a pull request's head run on each system the pool's runners name, with no
# secret and no identity token. `sluice`'s sign job signs the keys its tree
# bears out, as on the signer's branch. `sluice init actions --force` writes
# it again.
name: sluice-pr
on: pull_request
permissions: {}
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include: [{system: linux-x64, runner: ubuntu-24.04}] # the pool's runners
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Install sluice
        run: |
          case "$(uname -sm)" in
            "Linux x86_64") system=x86_64-linux ;;
            "Linux aarch64") system=aarch64-linux ;;
            "Darwin arm64") system=aarch64-darwin ;;
            *) echo "no release of sluice runs on $(uname -sm)" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/agentplot/sluice/releases/download/v${SLUICE_VERSION}/sluice-${system}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          SLUICE_VERSION: "{{version}}"
      - name: Run the head's checks
        run: sluice job run --head "$HEAD" --branch "$BASE" --system "$SYSTEM" --out "$RUNNER_TEMP/sluice-run"
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SYSTEM: ${{ matrix.system }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sluice-run-${{ matrix.system }}
          path: ${{ runner.temp }}/sluice-run
          if-no-files-found: ignore
